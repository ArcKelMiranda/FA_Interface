architecture_decisions:
  connection: facodes consumes the EXISTING yhat-mcp-server (sibling repo,
    C:\Users\KelvinMiranda\Desktop\Yhat\yhat-mcp-server) as an MCP client; facodes
    never talks to SQL Server directly
  interface: a new, separate Dockerized UI service owned by facodes (successor
    of the v5 artifact's table/drawer/fingerprint review UI), acting as MCP
    client to yhat-mcp-server. yhat-mcp-server explicitly will not host a UI
    (already decided in that project's own PRD).
  reads: via yhat-mcp-server's existing tools (yhat_query_entities primarily,
    yhat_query for admin raw SQL) — already implemented, no new work needed
  writes: yhat-mcp-server must be EXTENDED with write tools (cross-project
    change in the yhat-mcp-server repo, not part of facodes' own tasks) —
    revives that project's own previously-deferred writer-role + confirmation
    + audit-log design
  safety: satisfied by yhat-mcp-server's confirmation-flow design (server
    issues an approval-request signal, client — i.e. the facodes UI — requires
    explicit user confirmation before the committing call)
  credentials: facodes needs no SQL Server credentials at all (never connects
    directly to the DB); only needs whatever internal-identity/access
    credential yhat-mcp-server's HTTP mode requires
